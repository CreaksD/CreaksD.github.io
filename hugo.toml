baseURL = 'https://Lucas-Blog.github.io/'
languageCode = 'zh-cn'
title = "Lucas 的博客"
theme = 'PaperMod'
enableRobotsTXT = true
enableEmoji = true
defaultContentLanguage = 'zh-cn'

[markup.goldmark.renderer]
  unsafe = true

[params]
  env = 'production'
  description = '记录技术与生活'
  author = 'Lucas'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

[params.assets]
  favicon = "favicon.svg"
  favicon16x16 = "favicon.svg"
  favicon32x32 = "favicon.svg"

[params.homeInfoParams]
  Title = '你好，我是 Lucas'
  Content = '欢迎来到我的博客，这里记录技术与生活。'

[[menu.main]]
    identifier = 'posts'
    name = '文章'
    url = '/posts/'
    weight = 1
  [[menu.main]]
    identifier = 'archive'
    name = '归档'
    url = '/archives/'
    weight = 2
  [[menu.main]]
    identifier = 'search'
    name = '搜索'
    url = '/search/'
    weight = 3
  [[menu.main]]
    identifier = 'tags'
    name = '标签'
    url = '/tags/'
    weight = 4

[services]
  [services.googleAnalytics]
    ID = ''

[outputs]
  home = ['HTML', 'RSS', 'JSON']
